# Build desktop: compila o app para Windows e gera um ZIP portátil.
#
# O AppImage do Linux é compilado localmente por `.sh/build-appimage.sh`
# (o `build-desktop.sh` chama os dois). Aqui no GitHub só roda o Windows,
# que não pode ser compilado numa máquina Linux.
#
# Disparo manual: GitHub → Actions → "Build Desktop" → Run workflow
# Ou via script local: bash .sh/build-desktop.sh

name: Build Desktop

on:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (ZIP)
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify environment
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --exclude-tags golden

      - name: Build Windows (Release)
        run: flutter build windows --release

      # Tesseract (OCR) embutido: o app procura a pasta "ocr" ao lado do .exe.
      # O pacote do Chocolatey instala o Tesseract com as DLLs e o inglês;
      # os demais idiomas vêm do tessdata_fast (os menores).
      - name: Embed Tesseract (OCR)
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          $src = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$src\tesseract.exe")) {
            Write-Error "Tesseract not found in $src"
            exit 1
          }
          $dest = "build\windows\x64\runner\Release\ocr"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "$src\*.exe" $dest
          Copy-Item "$src\*.dll" $dest
          New-Item -ItemType Directory -Force -Path "$dest\tessdata" | Out-Null
          Copy-Item "$src\tessdata\configs" "$dest\tessdata" -Recurse
          if (Test-Path "$src\tessdata\tessconfigs") {
            Copy-Item "$src\tessdata\tessconfigs" "$dest\tessdata" -Recurse
          }
          foreach ($lang in "por","eng","spa","fra","deu","ita") {
            Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$lang.traineddata" -OutFile "$dest\tessdata\$lang.traineddata"
          }
          & "$dest\tesseract.exe" --tessdata-dir "$dest\tessdata" --list-langs

      - name: Create ZIP package
        id: package
        shell: pwsh
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          if (-not (Test-Path $releaseDir)) {
            Write-Error "Release folder not found: $releaseDir"
            exit 1
          }

          $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1
          $fullVersion = if ($versionLine) { $versionLine.Matches[0].Groups[1].Value } else { "dev" }
          $version = if ($fullVersion -match '^([^+]+)') { $Matches[1] } else { $fullVersion }
          $zipName = "pdf-enxuto_windows_${version}.zip"

          if (Test-Path $zipName) { Remove-Item $zipName -Force }
          Compress-Archive -Path "$releaseDir\*" -DestinationPath $zipName -CompressionLevel Optimal

          Write-Host "ZIP created: $zipName"
          "zip_name=$zipName" >> $env:GITHUB_OUTPUT

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-enxuto-windows
          path: ${{ steps.package.outputs.zip_name }}
          retention-days: 30
