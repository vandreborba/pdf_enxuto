# Compila o app Flutter para desktop: Windows (ZIP portátil) e Linux (AppImage).
# Disparo manual: GitHub → Actions → "Build Desktop" → Run workflow
# Ou via script local: bash .sh/build-desktop.sh

name: Build Desktop

on:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (ZIP)
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify environment
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --exclude-tags golden

      - name: Build Windows (Release)
        run: flutter build windows --release

      - name: Create ZIP package
        id: package
        shell: pwsh
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          if (-not (Test-Path $releaseDir)) {
            Write-Error "Release folder not found: $releaseDir"
            exit 1
          }

          $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1
          $fullVersion = if ($versionLine) { $versionLine.Matches[0].Groups[1].Value } else { "dev" }
          $version = if ($fullVersion -match '^([^+]+)') { $Matches[1] } else { $fullVersion }
          $zipName = "pdf-enxuto_windows_${version}.zip"

          if (Test-Path $zipName) { Remove-Item $zipName -Force }
          Compress-Archive -Path "$releaseDir\*" -DestinationPath $zipName -CompressionLevel Optimal

          Write-Host "ZIP created: $zipName"
          "zip_name=$zipName" >> $env:GITHUB_OUTPUT

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-enxuto-windows
          path: ${{ steps.package.outputs.zip_name }}
          retention-days: 30

  linux-appimage:
    name: Linux (AppImage)
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Verify environment
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --exclude-tags golden

      - name: Build Linux (Release)
        run: flutter build linux --release

      - name: Create AppImage
        id: package
        run: |
          set -euo pipefail

          VERSION="$(grep -oP '^version:\s*\K[^+]+' pubspec.yaml | head -1)"
          [ -n "$VERSION" ] || VERSION="dev"
          APPIMAGE_NAME="pdf-enxuto_${VERSION}_x86_64.AppImage"

          BUNDLE="build/linux/x64/release/bundle"
          if [ ! -x "$BUNDLE/pdf-enxuto" ]; then
            echo "Executable not found: $BUNDLE/pdf-enxuto"
            exit 1
          fi

          APPDIR="$PWD/AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          cp -r "$BUNDLE"/* "$APPDIR/usr/bin/"

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="$HERE/usr/bin:$PATH"
          exec "$HERE/usr/bin/pdf-enxuto" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          cp assets/icons/icon_256.png "$APPDIR/pdf-enxuto.png"
          cat > "$APPDIR/pdf-enxuto.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=PDF Enxuto
          Comment=Compressor e divisor de PDF 100% local
          Exec=pdf-enxuto
          Icon=pdf-enxuto
          Terminal=false
          Categories=Utility;Office;Compression;
          MimeType=application/pdf;
          Keywords=pdf;comprimir;compactar;reduzir;dividir;separar;split;compress;
          EOF

          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APPDIR" "$APPIMAGE_NAME"

          if [ ! -f "$APPIMAGE_NAME" ]; then
            echo "AppImage not created: $APPIMAGE_NAME"
            exit 1
          fi

          echo "AppImage created: $APPIMAGE_NAME"
          "appimage_name=$APPIMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-enxuto-linux-appimage
          path: ${{ steps.package.outputs.appimage_name }}
          retention-days: 30
